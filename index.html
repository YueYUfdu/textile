<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile | 高考作文写作工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        :root { --dai-blue: #2c3e50; --ya-white: #fdfaf2; }
        body { background-color: var(--ya-white); font-family: 'Noto Serif SC', serif; scroll-behavior: smooth; }
        .font-logo { font-family: 'Zhi Mang Xing', cursive; }
        .glass-nav { background: rgba(26, 26, 26, 0.98); backdrop-filter: blur(12px); border-bottom: 1px solid #334155; }
        
        .essay-canvas { 
            background-color: var(--ya-white);
            background-image: linear-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 100% 2.8rem;
            line-height: 2.8rem;
            padding: 2.5rem;
            border: 1px solid #d1d5db;
            min-height: 1200px;
            font-size: 1rem; 
            letter-spacing: 0.02em;
            color: #1a1a1a;
        }

        .btn-gold {
            background: linear-gradient(135deg, #c5a059 0%, #a67c37 100%);
            color: white; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gold:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(166, 124, 55, 0.3); }
        .btn-gold:disabled { opacity: 0.6; cursor: not-allowed; }

        .card-outline { border: 1px solid #e2e8f0; transition: all 0.4s ease; background: rgba(255,255,255,0.4); cursor: pointer; }
        .card-outline:hover { border-color: #a67c37; background: #fff; transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.05); }
        .progress-smooth { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-800">

    <nav class="glass-nav text-white p-4 sticky top-0 z-50 shadow-2xl">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl font-logo text-yellow-600">Textile</span>
                <span class="text-[11px] tracking-[0.2em] text-slate-400 uppercase border-l border-slate-700 pl-4 h-6 flex items-center">高考作文写作工具</span>
            </div>
            
            <div class="flex flex-col md:flex-row gap-2 items-end md:items-center mt-3 md:mt-0">
                <input id="customUrl" type="text" placeholder="代理地址(如火山引擎Endpoint)" class="bg-slate-900 border border-slate-700 text-[10px] px-2 py-1.5 rounded w-36 outline-none focus:border-yellow-600 text-slate-400">
                <select id="modelPreset" onchange="updateModelConfig()" class="bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded focus:outline-none focus:border-yellow-600 text-slate-200 cursor-pointer">
                    <option value="">选择模型路线...</option>
                    <option value="gemini">Gemini 1.5 Pro</option>
                    <option value="doubao">豆包 Doubao-Pro</option>
                    <option value="deepseek">DeepSeek V3/R1</option>
                    <option value="gpt4o">OpenAI GPT-4o</option>
                </select>
                <input id="apiKey" type="password" placeholder="API Key / EP-ID" class="bg-slate-800 border border-slate-700 text-xs px-3 py-1.5 rounded w-40 outline-none focus:border-yellow-600 text-slate-200">
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-12 px-6">
        <div id="progressWrapper" class="hidden mb-12">
            <div class="w-full bg-slate-200 h-1 rounded-full overflow-hidden">
                <div id="progressBar" class="progress-smooth bg-yellow-600 h-full w-0"></div>
            </div>
            <p id="progressStatus" class="text-[10px] text-yellow-800 font-bold mt-3 tracking-[0.3em] text-center uppercase opacity-70"></p>
        </div>

        <section id="step1" class="mb-16">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-4"><span class="w-12 h-[1px] bg-slate-800"></span>命题入局</h2>
            <textarea id="essayTopic" rows="8" class="w-full p-8 bg-white border border-slate-200 rounded shadow-sm outline-none focus:border-yellow-700 transition font-serif text-lg leading-relaxed" placeholder="输入作文题目材料。由特级教师为您点石成金..."></textarea>
            <div class="flex justify-end mt-6">
                <button onclick="generateOutlines()" id="btnOutline" class="btn-gold px-12 py-4 rounded-sm tracking-[0.3em] font-bold text-sm uppercase">解析材料 · 深度立意</button>
            </div>
        </section>

        <section id="step2" class="hidden mb-16">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-4 text-slate-700"><span class="w-12 h-[1px] bg-yellow-600"></span>逻辑骨架</h2>
            <div id="outlineCards" class="grid md:grid-cols-3 gap-8"></div>
        </section>

        <section id="step3" class="hidden">
            <div class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
                <h2 class="text-2xl font-bold flex items-center gap-4 text-slate-700"><span class="w-12 h-[1px] bg-yellow-600"></span>经纬成文</h2>
                <button onclick="copyEssay()" class="text-xs text-slate-400 hover:text-yellow-700 tracking-widest uppercase">Copy Full Text</button>
            </div>
            <article id="finalEssay" class="essay-canvas shadow-2xl text-slate-900 whitespace-pre-wrap font-serif-zh"></article>
        </section>
    </main>

    <script>
        const CONFIG = {
            gemini: { base: 'https://generativelanguage.googleapis.com/v1beta/openai', model: 'gemini-1.5-pro' },
            doubao: { base: 'https://ark.cn-beijing.volces.com/api/v3', model: 'doubao-pro-4k' },
            deepseek: { base: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
            gpt4o: { base: 'https://api.openai.com/v1', model: 'gpt-4o' }
        };

        let currentBase = "";
        let currentModel = "";

        function updateModelConfig() {
            const preset = document.getElementById('modelPreset').value;
            if(CONFIG[preset]) {
                currentBase = CONFIG[preset].base;
                currentModel = CONFIG[preset].model;
            }
        }

        const Progress = {
            update: (percent, msg) => {
                const wrapper = document.getElementById('progressWrapper');
                const bar = document.getElementById('progressBar');
                const status = document.getElementById('progressStatus');
                wrapper.classList.remove('hidden');
                bar.style.width = percent + '%';
                if(msg) status.innerText = msg;
                if(percent >= 100) setTimeout(() => wrapper.classList.add('hidden'), 2000);
            },
            fail: () => { document.getElementById('progressWrapper').classList.add('hidden'); }
        };

        async function callAI(messages) {
            const apiKey = document.getElementById('apiKey').value;
            const userUrl = document.getElementById('customUrl').value.trim();
            
            let baseUrl = (userUrl || currentBase).replace(/\/$/, "");
            if (!baseUrl.endsWith("/chat/completions")) {
                baseUrl += "/chat/completions";
            }

            if (!apiKey || !currentModel) { alert('配置缺失：请选择模型并填写 API Key'); return null; }
            
            try {
                const response = await fetch(baseUrl, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${apiKey}`, 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        model: currentModel, 
                        messages: messages, 
                        temperature: 0.7 
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `状态码: ${response.status}`);
                }
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error(error);
                let msg = error.message;
                if (msg.includes("404")) msg = "路径错误(404)。请确认代理地址是否包含正确的API路径。";
                if (msg.includes("Failed to fetch")) msg = "跨域(CORS)或网络拦截。豆包、Gemini等模型建议通过中转代理调用。";
                alert(`经纬中断：${msg}`);
                Progress.fail();
                return null;
            }
        }

        async function generateOutlines() {
            const topic = document.getElementById('essayTopic').value;
            if(!topic) return;
            const btn = document.getElementById('btnOutline');
            btn.disabled = true;
            Progress.update(20, "挖掘文化根源与哲学辩证...");

            const systemPrompt = `你是特级教师。针对命题给出三个递进提纲。输出纯净JSON格式：{"outlines": [{"title": "七字标题", "立意": "一句话立意", "points": ["对仗论点1", "对仗论点2", "对仗论点3"], "poems": ["真实诗句1", "真实诗句2", "真实诗句3"], "materials": ["素材1", "素材2", "素材3"]}]}`;

            const res = await callAI([{ role: "system", content: systemPrompt }, { role: "user", content: topic }]);
            if (res) {
                try {
                    const jsonMatch = res.match(/\{[\s\S]*\}/);
                    const data = JSON.parse(jsonMatch[0]);
                    const container = document.getElementById('outlineCards');
                    container.innerHTML = data.outlines.map(o => `
                        <div onclick='writeEssay(${JSON.stringify(o).replace(/'/g, "&apos;")})' class="card-outline p-6 rounded-sm">
                            <h3 class="font-bold text-base mb-4 text-slate-800 tracking-wide">${o.title}</h3>
                            <p class="text-[9px] text-slate-400 mb-4 italic leading-relaxed">${o.立意}</p>
                            <ul class="text-[11px] space-y-2 mb-5 text-slate-600 border-l border-yellow-700/30 pl-3">
                                ${o.points.map(p => `<li>${p}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('');
                    document.getElementById('step2').classList.remove('hidden');
                    Progress.update(100, "立意推演完成");
                } catch (e) {
                    alert("解析失败，请确保模型输出的是标准 JSON 格式。");
                    Progress.fail();
                }
            }
            btn.disabled = false;
        }

        async function writeEssay(outline) {
            const container = document.getElementById('finalEssay');
            document.getElementById('step3').classList.remove('hidden');
            container.innerHTML = "<div class='text-center py-24 italic text-slate-300 tracking-[0.5em]'>笔墨落纸，锦绣自成...</div>";
            window.scrollTo({ top: document.getElementById('step3').offsetTop - 100, behavior: 'smooth' });

            Progress.update(20, "起笔成章...");

            const systemPrompt = `你是特级教师。根据提纲创作1000字作文。风格典雅。开头意象起兴，段落论点开启，电影感描写。引用必须真实。`;
            const res = await callAI([{ role: "system", content: systemPrompt }, { role: "user", content: `提纲：${JSON.stringify(outline)}` }]);
            if (res) {
                Progress.update(100, "锦绣文章已成");
                container.innerText = res;
            }
        }

        function copyEssay() {
            navigator.clipboard.writeText(document.getElementById('finalEssay').innerText).then(() => alert('文稿已复制'));
        }
    </script>
</body>
</html>
