<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textile | 特级教师作文 AI 创作系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Helvetica Neue', sans-serif; }
        .font-serif-zh { font-family: 'Noto Serif SC', serif; }
        .font-art { font-family: 'Ma Shan Zheng', cursive; }
        .loading-dots:after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 40% { color: #374151; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .25em 0 0 #374151, .5em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .25em 0 0 #374151, .5em 0 0 #374151; } }
        .essay-paper { background-color: #fdfaf2; background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px); background-size: 20px 20px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20">

    <nav class="bg-slate-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-art">毂下 · 特级教师 AI 写作</h1>
            <div class="flex flex-wrap gap-2 text-xs">
                <input id="baseUrl" type="text" placeholder="API Base URL (e.g. https://api.deepseek.com/v1)" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded w-64 focus:outline-none focus:border-blue-500 text-slate-200">
                <input id="modelId" type="text" placeholder="模型 ID (e.g. deepseek-chat)" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded w-40 focus:outline-none focus:border-blue-500 text-slate-200">
                <input id="apiKey" type="password" placeholder="API Key" class="bg-slate-800 border border-slate-700 px-3 py-1 rounded w-32 focus:outline-none focus:border-blue-500 text-slate-200">
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto mt-8 p-4">
        <div class="mb-8 bg-blue-50 border-l-4 border-blue-400 p-4 text-sm text-blue-800 shadow-sm">
            <p class="mb-2"><strong>🚀 部署成功！配置指引：</strong></p>
            <ul class="list-disc ml-5 space-y-1">
                <li><b>DeepSeek:</b> URL 填 <code class="bg-blue-100 px-1">https://api.deepseek.com/v1</code> | 模型填 <code class="bg-blue-100 px-1">deepseek-chat</code></li>
                <li><b>OpenAI:</b> URL 填 <code class="bg-blue-100 px-1">https://api.openai.com/v1</code> | 模型填 <code class="bg-blue-100 px-1">gpt-4o</code></li>
                <li><b>智谱AI:</b> URL 填 <code class="bg-blue-100 px-1">https://open.bigmodel.cn/api/paas/v4/</code> | 模型填 <code class="bg-blue-100 px-1">glm-4</code></li>
            </ul>
        </div>

        <section id="step1" class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">1</span>
                <h2 class="text-lg font-bold">输入作文题目或材料</h2>
            </div>
            <textarea id="essayTopic" rows="6" class="w-full p-4 bg-slate-50 border rounded-lg focus:ring-2 focus:ring-slate-400 outline-none transition" placeholder="请在此输入完整的高考作文命题材料..."></textarea>
            <button onclick="getOutlines()" id="btnOutline" class="mt-4 bg-slate-800 text-white px-8 py-3 rounded-lg hover:bg-slate-700 transition">
                生成深度提纲
            </button>
        </section>

        <section id="step2" class="hidden space-y-4 mb-8">
            <div class="flex items-center gap-2 mb-4">
                <span class="bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">2</span>
                <h2 class="text-lg font-bold">选择立意架构</h2>
            </div>
            <div id="outlineCards" class="grid md:grid-cols-3 gap-6"></div>
        </section>

        <section id="step3" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-2">
                    <span class="bg-slate-800 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">3</span>
                    <h2 class="text-lg font-bold">一类文正文</h2>
                </div>
                <button onclick="copyEssay()" class="text-slate-500 hover:text-slate-800 text-sm">复制全文</button>
            </div>
            <div id="finalEssay" class="essay-paper p-8 md:p-12 border rounded-xl shadow-inner font-serif-zh text-lg leading-relaxed text-gray-800 whitespace-pre-wrap"></div>
        </section>
    </main>

    <script>
        async function callAI(messages) {
            const apiKey = document.getElementById('apiKey').value;
            const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/+$/, ''); // 去掉末尾斜杠
            const modelId = document.getElementById('modelId').value || 'gpt-4o';
            
            if (!apiKey) { alert('请输入 API Key'); return null; }
            if (!baseUrl) { alert('请输入 Base URL'); return null; }

            try {
                const response = await fetch(`${baseUrl}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: messages,
                        temperature: 0.7
                    })
                });

                if (!response.ok) {
                    const errorMsg = await response.text();
                    console.error('API Error:', errorMsg);
                    alert(`请求失败 (${response.status}): ${errorMsg.slice(0, 100)}`);
                    return null;
                }

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                console.error('Network Error:', error);
                alert('网络故障，请检查 URL 是否正确或是否存在跨域问题');
                return null;
            }
        }

        async function getOutlines() {
            const topic = document.getElementById('essayTopic').value;
            if(!topic) return;

            const btn = document.getElementById('btnOutline');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-dots text-sm text-slate-300">专家正在立意</span>';

            const systemPrompt = `你是特级教师。请根据材料给出3个差异化提纲。要求标题文学化，论点是对仗句。必须直接输出JSON: {"outlines": [{"title": "", "logic": "", "points": ["", "", ""], "material": ""}]}`;

            const result = await callAI([
                { role: "system", content: systemPrompt },
                { role: "user", content: topic }
            ]);

            if (result) {
                try {
                    const jsonMatch = result.match(/\{[\s\S]*\}/);
                    const data = JSON.parse(jsonMatch[0]);
                    const container = document.getElementById('outlineCards');
                    container.innerHTML = data.outlines.map((o, index) => `
                        <div onclick='writeFullEssay(${JSON.stringify(o)})' class="cursor-pointer bg-white border-2 border-slate-100 p-5 rounded-xl hover:border-slate-800 transition">
                            <h3 class="font-bold text-slate-800 mb-2">${o.title}</h3>
                            <ul class="text-xs space-y-2 border-l-2 border-slate-100 pl-3 mb-3">
                                ${o.points.map(p => `<li class="text-slate-500">${p}</li>`).join('')}
                            </ul>
                            <div class="text-[10px] text-slate-400 italic">预选素材：${o.material}</div>
                        </div>
                    `).join('');
                    document.getElementById('step2').classList.remove('hidden');
                } catch (e) {
                    alert("提纲解析失败，请重试");
                }
            }
            btn.disabled = false;
            btn.innerHTML = '生成深度提纲';
        }

        async function writeFullEssay(outline) {
            const container = document.getElementById('finalEssay');
            document.getElementById('step3').classList.remove('hidden');
            container.innerHTML = '<p class="loading-dots text-center py-20 text-slate-400">正在撰写千字一类文...</p>';
            window.scrollTo({ top: document.getElementById('step3').offsetTop - 50, behavior: 'smooth' });

            const topic = document.getElementById('essayTopic').value;
            const systemPrompt = `你是特级教师。根据提纲扩写1000字一类文。开头起兴，论点段落开启用对仗句，电影感镜头描写冷门素材，严禁流水账，结尾升华。`;
            const userPrompt = `题目：${topic}\n提纲：${JSON.stringify(outline)}`;

            const result = await callAI([
                { role: "system", content: systemPrompt },
                { role: "user", content: userPrompt }
            ]);

            if (result) {
                container.innerText = result;
            }
        }

        function copyEssay() {
            const text = document.getElementById('finalEssay').innerText;
            navigator.clipboard.writeText(text).then(() => alert('已复制到剪贴板'));
        }
    </script>
</body>
</html>
